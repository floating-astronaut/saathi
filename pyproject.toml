[project]
name = "saathi"
version = "0.1.0"
description = "WhatsApp-native, voice-first assistant for older adults in India"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "httpx",
    "python-dateutil",   # RRULE for recurring reminders
    "boto3",             # Bedrock (zai.glm-5, ap-south-1 regional)
    "structlog",
    "orjson",
    "pypdf",            # PDF text layer — most bills and reports have one
    "google-auth>=2.56.2",
    "requests>=2.34.2",
    "cryptography",      # Fernet, for minted vendor keys at rest (saathi/crypto.py)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saathi"]
